<!doctype html>
<!-- PROTOTYPE, throwaway. Approved hover panel (2026-11-06), all three modes idle and running. Spec: running-timer-design.md -->
<html lang="en"><head><meta charset="utf-8"><style>
  :root { --sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; --fill1:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.16); --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.32); --o:#8e8cff; --g:#5ee6b8; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  .gal { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px 12px; }
  h3 { font:600 13px var(--sans); margin-bottom:6px; } h3 span { font-weight:500; opacity:.6; }
  .cell { position:relative; overflow:hidden; border-radius:8px; background:#868b99; height:140px; }
  .notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:283px; height:124px; background:#000; color:#fff; border-radius:0 0 22px 22px; }
  .notch::before,.notch::after { content:""; position:absolute; top:0; width:8px; height:8px; }
  .notch::before { left:-8px; border-top-right-radius:8px; box-shadow:4px -4px 0 0 #000; }
  .notch::after { right:-8px; border-top-left-radius:8px; box-shadow:-4px -4px 0 0 #000; }
  .cam { position:absolute; top:0; left:50%; width:179px; height:32px; margin-left:-89.5px; border:1px dashed rgba(255,255,255,.12); border-top:0; border-radius:0 0 10px 10px; }
  .col { position:absolute; top:8px; bottom:8px; width:28px; padding:2px; border-radius:14px; background:var(--fill1); display:flex; flex-direction:column; justify-content:space-between; }
  .col.l { left:8px; } .col.r { right:8px; }
  .col span { height:24px; border-radius:12px; display:grid; place-items:center; color:var(--ink3); flex:none; }
  .col.l span.on { background:var(--fill2); color:#fff; }
  .col.l.lock span:not(.on) { color:rgba(235,235,245,.14); }
  .col.r span { color:#fff; }
  .col.r.tall { padding:0; align-items:center; justify-content:center; color:#000; }
  .col.r.tall svg { width:17px; height:17px; margin-left:2px; }
  .col svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .col svg .f { fill:currentColor; stroke:none; }
  .body { position:absolute; left:44px; right:44px; top:34px; bottom:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .num { font-variant-numeric:tabular-nums; }
  .t { font:500 32px/1 var(--round); }
  .ruler { position:relative; width:100%; height:30px; overflow:hidden; flex:none; -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); }
  .ticks { position:absolute; left:0; right:0; top:3px; height:8px; background:repeating-linear-gradient(90deg, var(--ink3) 0 1px, transparent 1px 8px); background-position:3.5px 0; }
  .maj { position:absolute; left:0; right:0; top:0; height:14px; background:repeating-linear-gradient(90deg, var(--ink2) 0 1px, transparent 1px 40px); background-position:19.5px 0; }
  .needle { position:absolute; left:50%; top:0; width:2px; height:17px; margin-left:-1px; border-radius:1px; }
  .lab { position:absolute; top:18px; transform:translateX(-50%); font-size:10.5px; font-weight:500; color:var(--ink2); display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .lab.c { color:#fff; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .chips { display:flex; gap:6px; justify-content:center; }
  .chip { height:34px; min-width:52px; padding:0 10px; border-radius:12px; display:grid; place-items:center; font:500 22px/1 var(--round); }
  .bar { display:flex; gap:3px; width:100%; }
  .bar i { height:4px; border-radius:2px; background:var(--fill2); overflow:hidden; position:relative; }
  .bar i b { position:absolute; inset:0; }
  .pbar { width:100%; height:4px; border-radius:2px; background:var(--fill2); overflow:hidden; }
  .pbar i { display:block; height:100%; border-radius:2px; }
  .sub { font-size:11px; font-weight:500; color:var(--ink2); margin-top:-4px; }
</style></head><body><div class="gal" id="gal"></div>
<script>
const MODES = ['<circle cx="8" cy="9.3" r="5.4"/><path d="M6.4 1.6h3.2M8 1.6v2.3M8 9.3V6.6"/>', '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.4 1.6"/>', '<path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v2.6h-2.6"/>'];
const PLAY = '<path class="f" d="M4.5 2.6v10.8L13 8z"/>', PAUSE = '<path class="f" d="M4 2.5h2.8v11H4zM9.2 2.5H12v11H9.2z"/>',
      RESTART = '<path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 2.5v2.6h2.6"/>', STOP = '<rect class="f" x="3.5" y="3.5" width="9" height="9" rx="2"/>';
const left = (on,run) => '<div class="col l'+(run?' lock':'')+'">'+MODES.map((p,i)=>'<span'+(i===on?' class="on"':'')+'><svg viewBox="0 0 16 16">'+p+'</svg></span>').join("")+'</div>';
const right = (run,c) => run
  ? '<div class="col r"><span style="background:'+c+';color:#000"><svg viewBox="0 0 16 16">'+PAUSE+'</svg></span><span><svg viewBox="0 0 16 16">'+RESTART+'</svg></span><span><svg viewBox="0 0 16 16">'+STOP+'</svg></span></div>'
  : '<div class="col r tall" style="background:'+c+'"><svg viewBox="0 0 16 16">'+PLAY+'</svg></div>';
const ruler = (c,labs) => '<div class="ruler"><div class="ticks"></div><div class="maj"></div><div class="needle" style="background:'+c+'"></div>'+
  labs.map(([x,txt,dc,cc])=>'<span class="lab'+(cc?' c':'')+'" style="left:'+x+'%">'+(dc?'<span class="dot" style="background:'+dc+'"></span>':'')+txt+'</span>').join("")+'</div>';
const plan = (done, part) => { let s='', k=0; for (let i=0;i<4;i++){ [["var(--o)",25],["var(--g)",5]].forEach(([c,f],j)=>{ if(i===3&&j===1) return;
  const w = k<done ? 100 : k===done ? part : 0; s+='<i style="flex:'+f+'"><b style="width:'+w+'%;background:'+c+'"></b></i>'; k++; }); } return '<div class="bar">'+s+'</div>'; };
const ch = (v,bg,c) => '<div class="chip num" style="background:'+bg+';color:'+c+'">'+v+'</div>';
const pbar = (p,c) => '<div class="pbar"><i style="width:'+p+'%;background:'+c+'"></i></div>';
const cells = [
  ["Timer · idle", 0, false, "var(--o)", '<span class="t num" style="color:var(--o)">25:00</span>'+ruler("var(--o)",[[18,"Break","var(--g)"],[50,"Focus","var(--o)"],[82,"Deep","#f4b28a"]])],
  ["Timer · running", 0, true, "var(--o)", '<span class="t num" style="color:var(--o)">18:42</span>'+pbar(25,"var(--o)")],
  ["Until · idle", 1, false, "#fff", '<span class="t num">3:30 PM</span>'+ruler("#fff",[[16,"2:30"],[50,"in 1 h 32 m",null,true],[84,"4:30"]])],
  ["Until · running", 1, true, "#fff", '<span class="t num">1:31:20</span><span class="sub num">until 3:30 PM</span>'+pbar(8,"#fff")],
  ["Pomodoro · idle", 2, false, "var(--o)", '<div class="chips">'+ch(25,"rgba(142,140,255,.2)","var(--o)")+ch(5,"rgba(94,230,184,.2)","var(--g)")+ch("×4","var(--fill1)","#fff")+'</div>'+plan(0,0).replace(/width:0%/g,"width:100%")],
  ["Pomodoro · running", 2, true, "var(--o)", '<span class="t num" style="color:var(--o)">12:07</span>'+plan(2,52)],
];
cells.forEach(([h,m,run,c,inner]) => {
  const d = document.createElement("div");
  d.innerHTML = '<h3>'+h+'</h3><div class="cell"><div class="notch"><div class="cam"></div>'+left(m,run)+right(run,c)+'<div class="body">'+inner+'</div></div></div>';
  document.getElementById("gal").appendChild(d);
  const b = d.querySelector(".body").getBoundingClientRect();
  const over = [...d.querySelectorAll(".body > *")].filter(e=>{const r=e.getBoundingClientRect();return r.right>b.right+.5||r.left<b.left-.5||r.bottom>b.bottom+.5||r.top<b.top-.5;});
  if (over.length) console.log(h, "overflow", over.map(e=>e.className).join(","));
});
</script></body></html>
